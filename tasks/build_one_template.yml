---
- name: "{{ os.key }} | Check whether template {{ os.value.template_id }} exists"
  ansible.builtin.command: qm status {{ os.value.template_id }}
  register: tmpl_status
  changed_when: false
  failed_when: false

- name: "{{ os.key }} | Destroy old template (rebuild=true)"
  ansible.builtin.command: qm destroy {{ os.value.template_id }} --purge
  when: tmpl_status.rc == 0 and (rebuild | bool)

- name: "{{ os.key }} | Check manually supplied image"
  ansible.builtin.stat:
    path: "{{ pve_image_dir }}/{{ os.key }}.qcow2"
  register: img
  when: os.value.image_url is not defined

- name: "{{ os.key }} | Note whether a manual image is missing"
  ansible.builtin.set_fact:
    manual_image_missing: "{{ os.value.image_url is not defined and not img.stat.exists }}"

- name: "{{ os.key }} | Image missing"
  vars:
    missing_msg: >-
      SKIPPED {{ os.key }}: it has no download URL. Download the image yourself and copy it to
      {{ pve_image_dir }}/{{ os.key }}.qcow2 on {{ inventory_hostname }} (see os_catalog.yml),
      then run: ansible-playbook build_templates.yml -e only_os={{ os.key }}
  ansible.builtin.fail:
    msg: "{{ missing_msg }}"
  # Building just this OS -> stop with an error. Building everything -> warn and move on.
  when: manual_image_missing | bool and (tmpl_status.rc != 0 or (rebuild | bool)) and only_os is defined

- name: "{{ os.key }} | Image missing (continuing with the other OSes)"
  ansible.builtin.debug:
    msg: >-
      SKIPPED {{ os.key }}: copy its image to {{ pve_image_dir }}/{{ os.key }}.qcow2 on
      {{ inventory_hostname }}, then run: ansible-playbook build_templates.yml -e only_os={{ os.key }}
  when: manual_image_missing | bool and (tmpl_status.rc != 0 or (rebuild | bool)) and only_os is not defined

- name: "{{ os.key }} | Build template"
  when: (tmpl_status.rc != 0 or (rebuild | bool)) and not (manual_image_missing | bool)
  vars:
    image_path: "{{ pve_image_dir }}/{{ os.key }}.qcow2"
    tid: "{{ os.value.template_id }}"
  block:
    - name: "{{ os.key }} | Download cloud image"
      ansible.builtin.get_url:
        url: "{{ os.value.image_url }}"
        dest: "{{ image_path }}"
        mode: "0644"
        force: "{{ rebuild | bool }}"
      when: os.value.image_url is defined

    - name: "{{ os.key }} | Bake in qemu-guest-agent"
      ansible.builtin.command: >
        virt-customize -a {{ image_path }}
        --install qemu-guest-agent
        --run-command 'systemctl enable qemu-guest-agent'
        --truncate /etc/machine-id
      when: os.value.bake_agent | default(true) | bool

    - name: "{{ os.key }} | Create VM shell"
      ansible.builtin.command: >
        qm create {{ tid }}
        --name {{ os.value.template_name }}
        --ostype l26 --machine q35 --bios ovmf
        --efidisk0 {{ pve_storage }}:0,efitype=4m,pre-enrolled-keys=0
        --cpu host --cores 2 --memory {{ os.value.min_memory | default(2048) }}
        --net0 virtio,bridge={{ pve_bridge }}
        --scsihw virtio-scsi-single
        --agent enabled=1,fstrim_cloned_disks=1
        --serial0 socket --vga {{ os.value.vga | default('serial0') }}

    - name: "{{ os.key }} | Import disk"
      ansible.builtin.command: >
        qm set {{ tid }}
        --scsi0 {{ pve_storage }}:0,import-from={{ image_path }},discard=on,ssd=1,iothread=1

    - name: "{{ os.key }} | Add cloud-init drive and boot order"
      ansible.builtin.command: >
        qm set {{ tid }}
        --ide2 {{ pve_storage }}:cloudinit
        --boot order=scsi0
        --ipconfig0 ip=dhcp

    - name: "{{ os.key }} | Attach first-boot vendor-data"
      ansible.builtin.command: >
        qm set {{ tid }} --cicustom vendor={{ pve_snippet_storage }}:snippets/{{ os.value.vendor_snippet }}
      when: os.value.vendor_snippet is defined

    - name: "{{ os.key }} | Disable Proxmox first-boot package upgrade"
      ansible.builtin.command: qm set {{ tid }} --ciupgrade 0
      when: not (os.value.ciupgrade | default(true) | bool)

    - name: "{{ os.key }} | Convert to template"
      ansible.builtin.command: qm template {{ tid }}
