---
# Builds a cloud-init template on the Proxmox host for each Linux OS in os_catalog.
# Re-running skips templates that already exist. Windows: build_windows_template.yml.
#
#   ansible-playbook build_templates.yml                      # all Linux OSes
#   ansible-playbook build_templates.yml -e only_os=debian13  # just one
#   ansible-playbook build_templates.yml -e rebuild=true      # replace existing
- name: Build Proxmox cloud-init templates
  hosts: proxmox
  become: false
  gather_facts: false
  vars:
    rebuild: false
    pve_snippet_storage: local
    pve_snippet_dir: /var/lib/vz/snippets
    wanted: "{{ os_catalog if only_os is not defined else {only_os: os_catalog[only_os]} }}"
    selected: "{{ wanted | dict2items | rejectattr('value.type', 'defined') | list }}"

  tasks:
    - name: Refuse Windows here
      ansible.builtin.assert:
        that: selected | length > 0
        fail_msg: "{{ only_os | default('') }} is a Windows entry - use build_windows_template.yml"

    - name: Install libguestfs-tools (to bake qemu-guest-agent into images)
      ansible.builtin.apt:
        name: libguestfs-tools
        state: present
        update_cache: true

    - name: Ensure image cache directory exists
      ansible.builtin.file:
        path: "{{ pve_image_dir }}"
        state: directory
        mode: "0755"

    - name: Cloud-init snippets
      when: selected | selectattr('value.vendor_snippet', 'defined') | list | length > 0
      block:
        - name: Allow snippets on '{{ pve_snippet_storage }}' storage
          ansible.builtin.shell: |
            c=$(pvesh get /storage/{{ pve_snippet_storage }} --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin)["content"])')
            case ",$c," in
              *,snippets,*) echo unchanged ;;
              *) pvesm set {{ pve_snippet_storage }} --content "$c,snippets" && echo changed ;;
            esac
          register: snip
          changed_when: "'changed' in snip.stdout"

        - name: Copy snippet files
          ansible.builtin.copy:
            src: "files/snippets/{{ item.value.vendor_snippet }}"
            dest: "{{ pve_snippet_dir }}/{{ item.value.vendor_snippet }}"
            mode: "0644"
          loop: "{{ selected | selectattr('value.vendor_snippet', 'defined') | list }}"
          loop_control:
            label: "{{ item.value.vendor_snippet }}"

    - name: Build each template
      ansible.builtin.include_tasks: tasks/build_one_template.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: os
        label: "{{ os.key }}"
