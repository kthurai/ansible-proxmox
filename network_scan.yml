---
# Scan the home network and write an Excel inventory (hostname, MAC, IP, vendor,
# device type, services...). Runs on the machine you start it from; that machine
# must be on the same LAN/Wi-Fi network as the devices (same broadcast domain).
#
# First time (and after OS upgrades) - installs tools and grants arp-scan/nmap
# raw-socket access, so later scans need no sudo:
#   ansible-playbook network_scan.yml -K
# Afterwards (and from Jenkins):
#   ansible-playbook network_scan.yml -e scan_setup=false
# Extras:  -e scan_ports=true (open ports, slower)   -e scan_os=true (OS guess, much slower)
#
# Report: reports/network_inventory.xlsx. Re-running updates it, keeps first/last-seen
# history, and the names/notes from files/network/known_devices.yml.
- name: Home network inventory
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: [min]

  vars:
    scan_subnet: 192.168.4.0/23
    scan_dns: 192.168.4.190          # router / Pi-hole that knows device names ('' = system default)
    scan_iface: ""                   # '' = interface with the default route
    scan_retries: 3
    scan_ports: false
    scan_os: false
    scan_setup: true                 # install tools, set capabilities, open firewall (needs -K)
    scan_open_firewall: true         # let mDNS / UPnP replies through firewalld (needed for names)
    report_file: "{{ playbook_dir }}/reports/network_inventory.xlsx"
    known_devices: "{{ playbook_dir }}/files/network/known_devices.yml"
    packages:
      RedHat: [arp-scan, nmap, avahi, avahi-tools, samba-client, bind-utils, libcap]
      Debian: [arp-scan, nmap, avahi-daemon, avahi-utils, samba-common-bin, dnsutils, libcap2-bin]

  tasks:
    - name: Make sure openpyxl (Excel writer) is in the venv
      ansible.builtin.pip:
        name: openpyxl
        executable: "{{ ansible_playbook_python | dirname }}/pip"

    - name: One-time setup (needs sudo)
      when: scan_setup | bool
      become: true
      block:
        - name: Install scanning tools
          ansible.builtin.package:
            name: "{{ packages[ansible_os_family] }}"
            state: present

        - name: Start avahi (mDNS) so .local names and smart-device services are seen
          ansible.builtin.service:
            name: avahi-daemon
            state: started
            enabled: true

        # Lets any user (incl. jenkins) run ARP / raw scans without sudo.
        - name: Give arp-scan and nmap raw-socket capability
          ansible.builtin.shell: |
            set -e
            for t in arp-scan nmap; do
              p=$(command -v $t || echo /usr/sbin/$t)
              p=$(readlink -f "$p")
              if ! getcap "$p" | grep -q cap_net_raw; then
                setcap cap_net_raw,cap_net_admin+eip "$p"; echo "changed $p"
              fi
            done
          args:
            executable: /bin/bash
          register: caps
          changed_when: "'changed' in caps.stdout"

        - name: Is firewalld running?
          ansible.builtin.command: firewall-cmd --state
          register: fw
          changed_when: false
          failed_when: false
          when: scan_open_firewall | bool

        - name: Allow mDNS and UPnP/SSDP replies from the LAN
          when: scan_open_firewall | bool and fw.rc == 0
          ansible.builtin.shell: |
            c=0
            firewall-cmd --permanent --query-service=mdns >/dev/null || { firewall-cmd --permanent --add-service=mdns; c=1; }
            r='rule family="ipv4" source address="{{ scan_subnet }}" source-port port="1900" protocol="udp" accept'
            firewall-cmd --permanent --query-rich-rule="$r" >/dev/null || { firewall-cmd --permanent --add-rich-rule="$r"; c=1; }
            [ $c = 1 ] && firewall-cmd --reload && echo changed || true
          register: fwr
          changed_when: "'changed' in fwr.stdout"

    - name: Report folder
      ansible.builtin.file:
        path: "{{ report_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Scan the network (1-3 minutes; longer with ports/OS)
      ansible.builtin.command:
        argv: "{{ ['' ~ ansible_playbook_python, playbook_dir ~ '/scripts/netscan.py',
                   '--subnet', scan_subnet, '--dns', scan_dns, '--out', report_file,
                   '--retries', scan_retries | string, '--known', known_devices]
                  + (['--iface', scan_iface] if scan_iface else [])
                  + (['--ports'] if scan_ports | bool else [])
                  + (['--os'] if scan_os | bool else []) }}"
      register: scan
      changed_when: true

    - name: Save a short summary for Jenkins
      ansible.builtin.copy:
        content: "{{ scan.stdout_lines | last }}\n"
        dest: "{{ report_file | dirname }}/last_scan.json"
        mode: "0644"

    - name: Result
      vars:
        r: "{{ scan.stdout_lines | last | from_json }}"
      ansible.builtin.debug:
        msg:
          - "Report: {{ r.report }}"
          - "Online now: {{ r.online }}   remembered offline: {{ r.offline }}   new: {{ r.new | length }}"
          - "New devices: {{ r.new | join(', ') if r.new else 'none' }}"
          - "Found per method: {{ r.by_source }}"
